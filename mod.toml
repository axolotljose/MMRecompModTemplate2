# Majora's Mask: Recompiled mod manifest.
# "Lilith's Lullaby" - a new ocarina song, the White Rose Sanctuary and the dungeon beneath it.

# Fields that end up in the mod's manifest.
[manifest]

# Unique ID of this mod.
id = "lilith_lullaby_white_rose"

# Version of this mod.
version = "0.1.1"

# The name that will show up for this mod in the mod menu.
display_name = "Lilith's Lullaby: White Rose Sanctuary"

# The description that will show up when this mod is displayed in the mod menu.
description = """
Adds a new ocarina song, Lilith's Lullaby (C-Up, C-Left, C-Right, C-Left, C-Up, C-Left, C-Down), that warps you to the \
White Rose Sanctuary, a hidden garden that holds the entrance to a brand new dungeon: the Thornbound Crypt, with new enemies, \
new puzzles and two new bosses.

Play the song anywhere the Song of Soaring is allowed. Play it again inside the Sanctuary or the Crypt to return to exactly \
where you were standing.

This mod is fully self contained and has no dependencies."""

# A short description that will show up in this mod's entry in the mod list.
short_description = "A new warp song, a hidden sanctuary and a new dungeon."

# Authors of this mod.
authors = [ "axolotljose" ]

# ID of the target recomp game.
game_id = "mm"

# Minimum version of the target recomp (e.g. Zelda 64: Recompiled) that this mod can run on.
minimum_recomp_version = "1.2.2"

# Dependency mods. None: everything (scene loading, actors, song) is implemented inside this mod.
dependencies = [
]

# Optional dependency mods.
optional_dependencies = [
]

# Native libraries (e.g. DLLs) and the functions they export.
native_libraries = [
]

# Inputs to the mod tool.
[inputs]

# Input elf file to generate a mod from.
elf_path = "build/mod.elf"

# Output mod filename.
mod_filename = "lilith_lullaby_white_rose"

# Reference symbol files.
func_reference_syms_file = "Zelda64RecompSyms/mm.us.rev1.syms.toml"
data_reference_syms_files = [ "Zelda64RecompSyms/mm.us.rev1.datasyms.toml", "Zelda64RecompSyms/mm.us.rev1.datasyms_static.toml" ]

# Additional files to include in the mod.
additional_files = [ "thumb.png" ]
